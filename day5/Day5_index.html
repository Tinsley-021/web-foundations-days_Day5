<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day 5 / Users</title>
  <link rel="stylesheet" href="Day5_styles.css">
  <script src="Day5_users.js" defer></script>
</head>
<body>
  <main class="users-card">
    <header class="page-header">
      <h1>Day 5 <span>/ Users</span></h1>
    </header>

    <label class="search-box" for="filter-input">
      <span class="visually-hidden">Filter users by name</span>
      <input id="filter-input" type="search" placeholder="Filter users...">
      <span class="search-icon" aria-hidden="true"></span>
    </label>

    <p id="status" role="status" aria-live="polite"></p>
    <ul id="users-list" aria-label="Users"></ul>

    <button id="load-users" class="load-button" type="button"
      aria-label="Load users" title="Load users">+</button>
  </main>
</body>
</html>
